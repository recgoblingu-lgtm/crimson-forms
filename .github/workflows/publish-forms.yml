name: Save and publish forms

on:
  push:
    branches: [main]
    paths:
      - 'forms/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/publish-forms.yml'
  workflow_dispatch:
    inputs:
      form_json:
        description: 'Paste the JSON copied from Crimson Form Studio. Leave empty to republish saved forms.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crimson-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save new form definition
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.form_json != '' }}
        env:
          FORM_JSON: ${{ inputs.form_json }}
        run: node scripts/save-form.mjs
      - name: Validate forms and generate issue templates and catalog
        run: node scripts/build.mjs
      - name: Commit saved and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forms .github/ISSUE_TEMPLATE site/forms.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save and publish Crimson form definitions'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
